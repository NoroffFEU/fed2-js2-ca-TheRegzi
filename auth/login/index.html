<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SnapGram</title>
  <link rel="icon" href="/favicon_io (10)/favicon.ico">
  <script src="https://kit.fontawesome.com/878e5c0278.js" crossorigin="anonymous"></script>
  <script type="module" src="/src/app.js"></script>
</head>
<body class="flex flex-col min-h-screen">
  <header class="flex flex-row text-white justify-between items-center bg-primary font-accent">
    <div>
      <a href="/index.html"><img src="/favicon_SG/android-chrome-512x512.png" alt="SnapGram Logo" class="h-24 md:h-28 p-4 pl-8"></a>
    </div>
    <nav>
      <div class="hamburger-menu">
        <button id="hamburger-button" aria-label="Menu button" class="pr-10 flex flex-col md:hidden text-xl text-black"><i class="fa-solid fa-bars"></i></button>
        <div id="hamburger-content" class="hidden flex flex-col md:block text-lg text-black">
          <a class="px-10 mb-4 md:mb-0 font-medium" href="/profile/">My Profile</a>
          <a class="px-10 mb-4 md:mb-0 font-medium" href="/post/create/">Create Post</a>
          <button class="mt-2 md:mt-0 w-28 ml-10 mr-12 text-left text-white font-medium rounded-xl bg-accent py-2 px-4" id="logOut">Logout</button>
        </div>
      </div>
    </nav>
  </header>
    <main class="flex-1">
    <h1 class="font-heading text-lg sm:text-xl font-medium flex justify-center m-8 sm:m-10">Login to SnapGram</h1>
    <div class="flex flex-col items-center justify-center">
    <form name="login" id="login" class="flex flex-col items-center border-4 border-secondary rounded-lg w-350 sm:w-550 p-5">
      <div class="w-full flex flex-col">
        <label for="email" class="font-heading text-lg mb-2">Email</label>
        <input id="email" type="email" name="email" autocomplete="username" class="font-post border-2 border-accent rounded p-3" required />
      </div>
      <div class="w-full flex flex-col">
        <label for="password" class="font-heading text-lg my-2">Password</label>
        <input type="password" name="password" id="password" autocomplete="current-password" class="font-post border-2 border-accent rounded p-3" required />
      </div>
      <button class="bg-accent rounded-lg text-white my-7 px-5 py-2 font-accent text-sm sm:text-md">Login</button>
      <p class="font-post text-sm mb-4 font-medium">Not a user? <a class="text-accent font-semibold" href="/auth/register/">Register here!</a></p>
    </form>
    </div>
  </main>
  <footer class="bg-primary font-accent p-16 md:p-24 mt-12">
    <div class="md:ml-10">
      <p>&copy; 2024 SnapGram, Inc.</p>
      <p>All rights reserved</p>
    </div>
  </footer>
</body>
</html>
