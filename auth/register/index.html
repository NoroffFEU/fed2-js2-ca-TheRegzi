<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SnapGram</title>
  <link rel="icon" href="/favicon_io (10)/favicon.ico">
  <script src="https://kit.fontawesome.com/878e5c0278.js" crossorigin="anonymous"></script>
  <script type="module" src="/src/app.js"></script>
</head>
<body class="flex flex-col min-h-screen">
  <header class="flex flex-row text-white justify-between items-center bg-primary font-accent">
    <div>
      <a href="/index.html"><img src="/favicon_SG/android-chrome-512x512.png" alt="SnapGram Logo" class="h-24 md:h-28 p-4 pl-8"></a>
    </div>
    <nav>
      <div class="hamburger-menu">
        <button id="hamburger-button" aria-label="Menu button" class="pr-10 flex flex-col md:hidden text-xl text-black"><i class="fa-solid fa-bars"></i></button>
        <div id="hamburger-content" class="hidden flex flex-col md:block text-lg text-black">
          <a class="px-10 mb-4 md:mb-0 font-medium" href="/auth/login/">Login</a>
          <a class="px-10 mb-4 md:mb-0 font-medium" href="/auth/register/">Register</a>
        </div>
      </div>
    </nav>
  </header>
    <main class="flex-1">
  <h1 class="font-heading text-lg sm:text-xl font-medium flex justify-center m-8 sm:m-10">Register</h1>
<div class="flex flex-col items-center justify-center">
    <form name="register" id="register" class="flex flex-col items-center border-4 border-secondary rounded-lg w-350 sm:w-550 p-5">
      <div class="w-full flex flex-col">
        <label for="name" class="font-heading text-lg mb-2">Username</label>
        <input id="name" type="text" name="name" class="font-post border-2 border-accent rounded p-3" autocomplete="username" required maxlength="20" pattern="^[\w]+$" title="Please enter a username using only letters and numbers"/>
      </div>
      <div class="w-full flex flex-col">
        <label for="email" class="font-heading text-lg my-2">Email</label>
        <input id="email" type="email" name="email" class="font-post border-2 border-accent rounded p-3" autocomplete="email" required pattern="^[\w\-.]+@(stud\.)?noroff\.no$" title="Please enter a valid noroff.no or stud.noroff.no address"/>
      </div>
      <div class="w-full flex flex-col">
        <label for="password" class="font-heading text-lg my-2">Password</label>
        <input type="password" name="password" id="password"  autocomplete="current-password" class="font-post border-2 border-accent rounded p-3" required minlength="8"/>
      </div>
      <div class="w-full flex flex-col">
        <label for="bio" class="font-heading text-lg my-2">Bio (optional)</label>
        <textarea name="bio" id="bio" class="font-post border-2 border-accent rounded p-3"></textarea>
      </div>
      <div class="w-full flex flex-col">
        <label for="avatarUrl" class="font-heading text-lg my-2">Profile Image URL (optional)</label>
        <input type="url" name="avatarUrl" id="avatarUrl" class="font-post border-2 border-accent rounded p-3"/>
      </div>
      <button type="submit" class="bg-accent rounded-lg text-white my-7 px-5 py-2 font-accent text-sm sm:text-md">Register</button>
      <p class="font-post text-sm mb-4 font-medium">Already registered? <a class="text-accent font-semibold" href="/auth/login/">Login here!</a></p>
    </form>
  </div>
  </main>
  <footer class="bg-primary font-accent p-16 md:p-24 mt-12">
    <div class="md:ml-10">
      <p>&copy; 2024 SnapGram, Inc.</p>
      <p>All rights reserved</p>
    </div>
  </footer>
</body>
</html>
